name: valora_assets
version: 0.80.2+82
publish_to: 'none'
description: Release-candidate polished clean-room Flutter Android app for Valora personal asset lifecycle management.

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  crypto: ^3.0.7
  liquid_glass_easy: 2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
