name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Format, test, analyze, and debug build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check dependency notices and generate Pub SBOM
        run: dart run tooling/check_supply_chain.dart

      - name: Check Dart formatting
        run: dart run tooling/format_check.dart

      - name: Run unit and widget tests
        run: flutter test --no-pub

      - name: Run static analysis
        run: flutter analyze --no-pub --fatal-warnings --no-fatal-infos

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
