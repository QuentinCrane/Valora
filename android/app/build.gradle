plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.android"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def requiredSigningProperties = ["storePassword", "keyPassword", "keyAlias", "storeFile"]
def releaseSigningConfigured = keystorePropertiesFile.exists()
        && requiredSigningProperties.every { key ->
            def value = keystoreProperties.getProperty(key)
            value != null && !value.trim().isEmpty() && !value.startsWith("replace-with")
        }
        && rootProject.file(keystoreProperties.getProperty("storeFile", "")).isFile()

android {
    namespace "com.valora.assets"
    compileSdk flutter.compileSdkVersion

    defaultConfig {
        applicationId "com.valora.assets"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode 82
        versionName "0.80.2"

        // Release APK size: publish an arm64 package by default instead of a universal APK.
        // Flutter's --split-per-abi diagnostic build supplies its own ABI filters,
        // so leave that mode to generate the comparison APKs for all supported ABIs.
        if (!project.hasProperty("split-per-abi")) {
            ndk {
                abiFilters "arm64-v8a"
            }
        }

        // The app ships Chinese and English resources, so strip unused transitive locales.
        resConfigs "zh", "zh-rCN", "zh-rTW", "b+zh+Hans", "b+zh+Hant", "en"
    }


    packagingOptions {
        // Compress native libraries inside the APK. This can noticeably reduce the
        // downloadable APK size for Flutter/ML apps at the cost of slightly more
        // install-time extraction work.
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                "META-INF/AL2.0",
                "META-INF/LGPL2.1",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*",
                "META-INF/*.kotlin_module"
            ]
        }
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseSigningConfigured
                    ? signingConfigs.release
                    : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releasePackagingRequested = taskGraph.allTasks.any { task ->
        task.name in ["assembleRelease", "bundleRelease", "packageRelease", "signReleaseBundle"]
    }
    if (releasePackagingRequested && !releaseSigningConfigured) {
        throw new GradleException(
                "Release signing is required. Configure android/key.properties and a real keystore before building a release artifact.")
    }
}

flutter {
    source "../.."
}


dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.work:work-runtime:2.11.2"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
}
