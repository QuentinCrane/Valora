plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.android"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.valora.assets"
    compileSdk flutter.compileSdkVersion

    defaultConfig {
        applicationId "com.valora.assets"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode 81
        versionName "0.80.1"

        // Release APK size: publish an arm64 package by default instead of a universal APK.
        // Remove this block only if you intentionally need 32-bit / x86 emulator packages.
        ndk {
            abiFilters "arm64-v8a"
        }

        // The app ships Chinese and English resources, so strip unused transitive locales.
        resConfigs "zh", "zh-rCN", "zh-rTW", "b+zh+Hans", "b+zh+Hant", "en"
    }


    packagingOptions {
        // Compress native libraries inside the APK. This can noticeably reduce the
        // downloadable APK size for Flutter/ML apps at the cost of slightly more
        // install-time extraction work.
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                "META-INF/AL2.0",
                "META-INF/LGPL2.1",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*",
                "META-INF/*.kotlin_module"
            ]
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source "../.."
}


dependencies {
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.activity:activity:1.9.3"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
}
